---
name: Unit Tests with released Puppet gem

on:
  workflow_call:
    inputs:
      puppet_versions:
        description: 'JSON list of Puppet major versions to test, e.g. ''["8", "9"]''. Puppet 8 runs on Ruby 3.1; later versions run on Ruby 4.0.'
        type: string
        default: '["8"]'
    secrets:
      PUPPET_FORGE_TOKEN_PUBLIC:
        required: true

jobs:
  unit_tests_with_released_puppet_gem:
    name: Puppet${{ matrix.puppet_version }} gem on Ruby ${{ matrix.puppet_version == '8' && '3.1' || '4.0' }} on ${{ matrix.os_type }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-2022']
        puppet_version: ${{ fromJSON(inputs.puppet_versions) }}
        # The Ruby version is derived from puppet_version in expressions below
        # rather than via include entries, because an include entry for a
        # puppet_version that the caller didn't request creates a stray job.
        include:
          - os: 'ubuntu-latest'
            os_type: 'Linux'
          - os: 'macos-latest'
            os_type: 'macOS'
          - os: 'windows-2022'
            os_type: 'Windows'

    runs-on: ${{ matrix.os }}
    # Pin the Puppet major version so that a dependency conflict fails the
    # job instead of Bundler silently resolving an older Puppet.
    env:
      PUPPET_GEM_VERSION: "~> ${{ matrix.puppet_version }}.0"
    steps:
      - name: Checkout current PR code
        uses: actions/checkout@v6

      # Patron, a transitive dependency of beaker-abs, requires cURL
      # libraries. Under Ruby 4, Bundler can resolve a faraday version that
      # pulls it in, so install them for Puppet 9 and later.
      - name: Install cURL development files
        if: runner.os == 'Linux' && matrix.puppet_version != '8'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Install ruby version ${{ matrix.puppet_version == '8' && '3.1' || '4.0' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.puppet_version == '8' && '3.1' || '4.0' }}
          bundler-cache: true
        env:
          BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM: forge-key:${{ secrets.PUPPET_FORGE_TOKEN_PUBLIC || '' }}
          PUPPET_FORGE_TOKEN: 'YES'

      - name: Run unit tests
        run: bundle exec rake parallel_spec
        env:
          PUPPET_FORGE_TOKEN: 'YES'
